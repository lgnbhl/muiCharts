url: https://felixluginbuhl.com/muiCharts
template:
  bootstrap: 5
  # Look of felixluginbuhl.com (cream paper, warm ink, DM Sans text, Space
  # Grotesk headings), as in muiChat and BFS, with the cobalt of the hex logo
  # as primary.
  bslib:
    primary: "#1565C0"
    bg: "#FAF6F1"
    fg: "#3D3229"
    base_font: {google: "DM Sans"}
    heading_font: {google: {family: "Space Grotesk", wght: [500, 600, 700]}}
    code_font: {google: "Fira Code"}
    border-color: "rgba(28, 25, 23, 0.12)"
    # Dark mode (light-switch below): the dark scheme of felixluginbuhl.com.
    body-bg-dark: "#14120F"
    body-color-dark: "#E8E2DC"
    body-emphasis-color-dark: "#F5F1EC"
    body-secondary-color-dark: "#AFA294"
    body-secondary-bg-dark: "#1C1917"
    body-tertiary-bg-dark: "#1C1917"
    border-color-dark: "rgba(232, 226, 220, 0.12)"
    link-color-dark: "#90CAF9"
    link-hover-color-dark: "#BBDEFB"
  theme: arrow-dark
  light-switch: true
  opengraph:
    image:
      src: man/figures/card.png
      alt: "muiCharts: interactive MUI X Charts for Shiny and Quarto"
  includes:
    # Roboto for the live charts of the articles (MUI is designed for it).
    # The rest of the site styles are in pkgdown/extra.css.
    in_header: |
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap">

authors:
  Felix Luginbuhl:
    href: "https://felixluginbuhl.com"

# Footer: the package family (the honeycomb of felixluginbuhl.com, in small)
# and pkgdown's "Developed by" line. The family is a plain link here;
# pkgdown/extra.js fills it from felixluginbuhl.com/stickers.json, so the
# list of packages lives in one place. Styles in pkgdown/extra.css.
footer:
  structure:
    left: [family, developed_by]
    right: built_with
  components:
    family: '<nav class="hexfamily" aria-label="More R packages"><a href="https://felixluginbuhl.com/#packages">More R packages</a></nav>'

llm-docs: true

navbar:
  structure:
    left: [intro, charts, features, custom, reference, news]
    right: [search, lightswitch, github, homepage]
  components:
    intro:
      text: Get started
      href: articles/introduction.html
    charts:
      text: Chart Types
      menu:
      - text: Bar Charts
        href: articles/bars.html
      - text: Line Charts
        href: articles/lines.html
      - text: Area Charts
        href: articles/areas.html
      - text: Pie Charts
        href: articles/pies.html
      - text: Scatter Charts
        href: articles/scatter.html
      - text: Radar Charts
        href: articles/radar.html
      - text: Sparkline Charts
        href: articles/sparkline.html
      - text: Gauge Charts
        href: articles/gauge.html
    features:
      text: Features
      menu:
      - text: Axis & Grid
        href: articles/axis.html
      - text: Tooltip
        href: articles/tooltip.html
      - text: Legend
        href: articles/legend.html
      - text: Highlighting
        href: articles/highlighting.html
      - text: Styling
        href: articles/styling.html
      - text: Composition
        href: articles/composition.html
    custom:
      text: Custom
      menu:
      - text: Custom Components
        href: articles/custom-components.html
      - text: Shiny
        href: articles/shiny.html
      - text: Quarto
        href: articles/quarto.html
      - text: llms.txt
        href: llms.txt
    news:
